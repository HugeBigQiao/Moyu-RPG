# 玄门诡事录 · cordis 应用配置
#
# 每个条目是一个插件。这里只声明「有哪些插件、各自配什么」，
# 真正的启动顺序由插件里的 static inject 推导，不靠书写顺序。
#
# 环境变量优先：start 脚本会设置 MOYU_PORT / MOYU_HOST / MOYU_DATABASE_URL，
# 下面的 !!js 表达式在启动时求值，所以 .env/环境变量能覆盖默认值。
#
# 说明：`name` 相对 server/ 解析；`config` 会先过各插件导出的 Schema 校验。

- id: content
  name: ./src/plugins/content.ts
  config:
    dir: ./data/content

- id: db
  name: ./src/db/client.ts
  config:
    url: !!js "process.env.MOYU_DATABASE_URL ?? 'sqlite://./data/moyu.db'"

- id: rules
  name: ./src/plugins/rules.ts

- id: http
  name: ./src/plugins/http.ts
  config:
    host: !!js "process.env.MOYU_HOST ?? '127.0.0.1'"
    port: !!js "Number(process.env.MOYU_PORT ?? 8888)"
    dist: ../frontend/dist

- id: api
  name: ./src/plugins/api.ts

- id: health
  name: ./src/plugins/health.ts
